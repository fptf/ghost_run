[project]
name = "runners-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "boto3>=1.35",
    "pyjwt>=2.15.1",
    "google-auth>=2.62.2",
    "requests>=2.34.2",
    "geoalchemy2>=0.21.0",
    "pydantic[email]>=2.14.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "testcontainers[postgres,redis]>=4.9",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "celery-types>=0.22",
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app"]

[[tool.mypy.overrides]]
module = "app.domain.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
