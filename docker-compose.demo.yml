# Демо-стенд: один хост, наружу один порт WEB_PORT (по умолчанию 8088): nginx со статикой
# фронта и прокси на API.
# Запуск: docker compose -f docker-compose.demo.yml --env-file deploy/demo.env up -d --build
name: runners-demo

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://runners:${POSTGRES_PASSWORD}@postgres:5432/runners
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://s3:8333
  S3_ACCESS_KEY: runners
  S3_SECRET_KEY: runners-secret
  S3_BUCKET: tracks
  JWT_SECRET: ${JWT_SECRET}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  # Google не подключён: на закрытом демо вход — через dev-форму
  AUTH_DEV_LOGIN: "true"
  COOKIE_SECURE: ${COOKIE_SECURE:-false}

services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: runners
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: runners
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U runners -d runners"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.infra.celery_app:celery_app worker -B --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *backend-env
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports: ["${WEB_PORT:-8088}:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  s3data:
