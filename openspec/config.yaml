schema: spec-driven

context: |
  Все артефакты OpenSpec пишутся на русском; ключевые слова SHALL/MUST и WHEN/THEN — на английском.
  Источник требований — docs/tz.md; стек, архитектура и доменные термины — docs/project.md.
  Макеты экранов — docs/design (см. его README): ориентир по логике и компоновке, не по пикселям.
  Стек зафиксирован: Python 3.12 + FastAPI, PostgreSQL + PostGIS, Redis + Celery, S3,
  React + TypeScript + MapLibre. Альтернативы (NestJS и т. п.) не предлагать.
  Правила сопоставления маршрутов (раздел 5 ТЗ) — чистые функции в backend/app/domain/matching;
  все пороги читаются из таблицы settings, а не из констант.
  Реальные координаты внутри скрытой зоны автора никогда не отдаются другим пользователям.
  Приватные треки и треки «по ссылке» не сопоставляются и не попадают в группы.
  Не реализовывать то, что вынесено в «идеи на потом»: рейтинги без привязки к маршруту,
  сегменты, монетизацию.

rules:
  tasks:
    - Каждому Scenario из спеки соответствует минимум одна задача на автотест
    - Сопоставление маршрутов тестируется на реальных GPX из backend/tests/fixtures/tracks
  proposal:
    - Ссылаться на номера ФТ из docs/tz.md
